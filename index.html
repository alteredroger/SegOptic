<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SegOptic — diseño óptico de telescopios segmentados</title>
<meta name="description" content="Trazado de rayos, OPD, PSF/MTF, optimización y simulación de co-faseo para telescopios segmentados en anillo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2026.10.16c">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="20" cy="7" r="5.5"/><circle cx="31.3" cy="13.5" r="5.5"/><circle cx="31.3" cy="26.5" r="5.5"/>
        <circle cx="20" cy="33" r="5.5"/><circle cx="8.7" cy="26.5" r="5.5"/><circle cx="8.7" cy="13.5" r="5.5"/>
      </g><circle cx="20" cy="20" r="2.5" fill="currentColor"/>
    </svg>
    <div>
      <h1>SegOptic</h1>
      <p id="sysName" class="sub" contenteditable="true" spellcheck="false"></p>
    </div>
  </div>
  <div class="actions">
    <button id="btnNew" class="primary">Nuevo telescopio…</button>
    <select id="preset" aria-label="Ejemplos"></select>
    <button id="btnPreset">Cargar</button>
    <button id="btnOpen">Abrir…</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button id="btnSave">Guardar .json</button>
    <button id="btnExport">Prescripción .txt</button>
  </div>
</header>

<main>
  <section class="card" id="sysCard">
    <div class="card-h"><h2>Sistema</h2></div>
    <div id="sysPanel"></div>
  </section>

  <section class="card" id="ldeCard">
    <div class="card-h">
      <h2>Editor de superficies</h2>
      <div class="tools">
        <label class="lbl" title="Muestra las columnas de coeficientes asféricos"><input type="checkbox" id="chkAsph"> Asféricos</label>
        <button id="btnUndo" title="Deshacer (Ctrl+Z)" disabled>↶ Deshacer</button>
        <button id="btnRedo" title="Rehacer (Ctrl+Y)" disabled>↷ Rehacer</button>
        <button id="btnParax" title="Ajusta el último espesor al foco paraxial">Foco paraxial</button>
        <button id="btnAutofocus" title="Ajusta el último espesor minimizando el spot RMS en eje">Autofoco (RMS)</button>
      </div>
    </div>
    <div class="tablewrap"><table id="lde"></table></div>
    <div id="quick" class="quick"></div>
  </section>

  <section class="card analysis">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="panel" class="panel"></div>
  </section>
</main>

<footer class="foot">
  SegOptic v2026.10.16c · trazado real 3D secuencial · convenciones tipo Zemax (radio con signo, espesor negativo tras espejo)
</footer>

<script src="optics.js?v=2026.10.16c"></script>
<script src="designs.js?v=2026.10.16c"></script>
<script src="app.js?v=2026.10.16c"></script>
</body>
</html>
